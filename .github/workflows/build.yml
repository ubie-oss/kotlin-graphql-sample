name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # ratchet:actions/checkout@v2

      - uses: actions/setup-java@91d3aa4956ec4a53e477c4907347b5e3481be8c9 # ratchet:actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: 'gradle'

      - name: Build
        run: |
          ./gradlew ktlintCheck bootJar --no-daemon --max-workers 2

      - name: Test
        run: |
          ./gradlew test jacocoTestReport --no-daemon --max-workers 2

      - name: Archive test results
        uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # ratchet:actions/upload-artifact@v2
        if: always()
        with:
          name: test-report
          path: build/reports/jacoco/test
